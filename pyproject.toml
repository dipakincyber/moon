[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moon-personal"
version = "0.1.0"
description = "A private, configurable Linux companion CLI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sheets = [
	"google-api-python-client>=2.0",
	"google-auth>=2.0",
	"python-dotenv>=1.0",
]

[project.scripts]
moon = "moon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
